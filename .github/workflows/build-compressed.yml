name: Build Compressed

on:
  push:
    branches:
      - compressed-machines
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: ./gradlew clean shadowJar --console=plain > build.log 2>&1

      - name: Publish log and jar to build-output branch
        run: |
          mkdir /tmp/out
          cp build.log /tmp/out/build.log
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b build-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-output

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: InfinityExpansion2-compressed
          path: build/libs/*.jar
