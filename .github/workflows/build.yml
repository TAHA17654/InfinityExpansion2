name: Build MachineStacker
on:
  push:
    branches: [machinestacker-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: |
          set +e
          mvn -B package > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "ERROR|BUILD" build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MachineStacker
          path: target/MachineStacker-*.jar
