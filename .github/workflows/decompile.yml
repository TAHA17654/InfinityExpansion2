name: Build Networks Patch

on:
  push:
    branches:
      - networks-work
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - name: Compile patched classes
        id: compile
        continue-on-error: true
        run: gradle compileJava --console=plain > build.log 2>&1
      - name: Overlay classes onto the original jar
        if: steps.compile.outcome == 'success'
        run: |
          cp networks-original.jar networks-patched.jar
          cd build/classes/java/main
          jar uf ../../../../networks-patched.jar .
          cd ../../../..
          unzip -l networks-patched.jar | grep -E "CompressedBridge|LineOperationUtil|SmartGrabber" >> build.log
      - name: Publish log and jar
        run: |
          mkdir /tmp/pub
          cp build.log /tmp/pub/build.log
          cp networks-patched.jar /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b networks-output
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "networks patch output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" networks-output
      - name: Fail if compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
