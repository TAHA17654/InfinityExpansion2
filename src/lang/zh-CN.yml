      - "Used to configure the throttle slots of a Throttle Machine"
      - ""
      - "<click_info>Right Click: <passive>Apply settings"
      - "<click_info>Shift+Right Click: <passive>Store settings"

  NTW_EXPANSION_ITEM_MOVER:
    name: "&6Item Mover"
    lore:
      - "&6Right Click to move items into the Item Mover"
      - "&6Shift + Right Click to move items into the targeted storage"
      - "&cInfinite Storage is not supported"

  NTW_EXPANSION_BLUEPRINT_DECODER:
    name: "&6Network Blueprint Decoder"
    lore:
      - ""
      - "Decodes Network Blueprints"

  NTW_EXPANSION_DUE_MACHINE:
    name: "&6Throttle Machine"
    lore:
      - "When the input slot matches a whitelisted item, transfers the whitelisted amount to the output slot"

  NTW_EXPANSION_OFFSETTER:
    name: "&aSlot Offsetter"
    lore:
      - "&8Transfers between matching slots"
      - "&8Adjust the offset to decide the matching position"
      - "&7Place it facing one machine, and place another machine on the other side"

  NTW_EXPANSION_BETTER_GRABBER:
    name: "Better Network Grabber"
    lore:
      - "The Better Network Grabber tries to grab the first item"
      - "from the specified machine"

  NTW_SYNTHETIC_EMERALD_SHARD:
    name: "Synthetic Emerald Shard"
    lore:
      - "A shard of a synthetic emerald,"
      - "the backbone of information transfer"

  NTW_OPTIC_GLASS:
    name: "Optic Glass"
    lore:
      - "Glass that can transmit a small amount of information"

  NTW_OPTIC_CABLE:
    name: "Optic Cable"
    lore:
      - "A cable that can transmit a large amount of information"

  NTW_OPTIC_STAR:
    name: "Optic Star"
    lore:
      - "A star that can transmit a large amount of information"

  NTW_RADIOACTIVE_OPTIC_STAR:
    name: "Radioactive Optic Star"
    lore:
      - "A star that can transmit almost unlimited information"

  NTW_SHRINKING_BASE:
    name: "Shrinking Base"
    lore:
      - "A device that can make large objects smaller"

  NTW_SIMPLE_NANOBOTS:
    name: "Simple Nanobots"
    lore:
      - "Tiny robots that can help you with delicate tasks"

  NTW_ADVANCED_NANOBOTS:
    name: "Advanced Nanobots"
    lore:
      - "Tiny robots that can help you with delicate tasks"
      - "Smarter and more efficient than the simple version"

  NTW_AI_CORE:
    name: "AI Core"
    lore:
      - "A first-generation AI in a fragile shell"

  NTW_EMPOWERED_AI_CORE:
    name: "Empowered AI Core"
    lore:
      - "An advanced AI in a shell"

  NTW_PRISTINE_AI_CORE:
    name: "Pristine AI Core"
    lore:
      - "Said to have been unearthed from ancient ruins,"
      - "a perfect AI"

  NTW_INTERDIMENSIONAL_PRESENCE:
    name: "Interdimensional Presence"
    lore:
      - "This perfect AI"
      - "has even mastered the ability to cross dimensions"

  NTW_CONTROLLER:
    name: "Network Controller"
    lore:
      - "The Network Controller is the core of a network"
      - "Each network can have at most 1 Controller"

  NTW_BRIDGE:
    name: "Network Bridge"
    lore:
      - "Bridges connect different network items"
      - "to form a complete network"

  NTW_MONITOR:
    name: "Network Monitor"
    lore:
      - "The Network Monitor can interact with nearby blocks"
      - "and connect the specified block to the network"
      - ""
      - "Currently supported:"
      - "Infinity Expansion - Storage Unit"
      - "Fluffy Machines - Fluffy Barrel"
      - "Networks - Quantum Storage"
      - "<random_color>Networks Expansion - Network Drawer"

  NTW_IMPORT:
    name: "Network Importer"
    lore:
      - "The Network Importer sends the items inside it into the network"
      - "Transfers up to 9 stacks of items per SF tick"
      - "Can receive items from Cargo networks"

  NTW_EXPORT:
    name: "Network Exporter"
    lore:
      - "The Network Exporter can be set to"
      - "continuously send 1 stack of the specified item out of the network"
      - "Items can be withdrawn from it using Cargo"

  NTW_GRABBER:
    name: "Network Grabber"
    lore:
      - "The Network Grabber tries to grab the first item"
      - "from the specified machine"

  NTW_PUSHER:
    name: "Network Pusher"
    lore:
      - "The Network Pusher tries to push"
      - "the specified items into a machine"

  NTW_MOREPUSHER:
    name: "Network Pusher V2"
    lore:
      - "The Network Pusher tries to push"
      - "the specified items into a machine"
      - "This Pusher has 9 slots for pushing"

  NTW_BESTPUSHER:
    name: "Network Pusher V3"
    lore:
      - "The Network Pusher tries to push"
      - "the specified items into a machine"
      - "This Pusher has 12 slots for pushing"

  NTW_CONTROL_X:
    name: "Network Cutter"
    lore:
      - "The Network Cutter tries to"
      - "\"cut\" blocks from the world into the network"
      - "Only supports vanilla non-container blocks."
      - ""
      - "<click_info>Network Power Usage: <passive>100J per operation"

  NTW_CONTROL_V:
    name: "Network Paster"
    lore:
      - "The Network Paster tries to"
      - "\"paste\" blocks from the network into the world"
      - "Only supports vanilla blocks."
      - ""
      - "<click_info>Network Power Usage: <passive>100J per operation"

  NTW_VACUUM:
    name: "Network Vacuum"
    lore:
      - "The Network Vacuum picks up dropped items"
      - "within a 4x4 area around it,"
      - "then tries to send them into the network."
      - ""
      - "<click_info>Network Power Usage: <passive>100J/Slimefun tick"

  NTW_VANILLA_GRABBER:
    name: "Network Vanilla Container Grabber"
    lore:
      - "The Network Vanilla Container Grabber tries to"
      - "grab the first item from the specified vanilla container."
      - ""
      - "This machine cannot interact with the network directly,"
      - "you also need a Network Grabber"
      - "to input items from this machine into the network."

  NTW_VANILLA_PUSHER:
    name: "Network Vanilla Container Pusher"
    lore:
      - "The Network Vanilla Container Pusher tries to"
      - "push its items into the specified vanilla container."
      - ""
      - "This machine cannot interact with the network directly,"
      - "you also need a Network Pusher"
      - "to push items from the network into this machine."

  NTW_NETWORK_WIRELESS_TRANSMITTER:
    name: "Network Wireless Transmitter"
    lore:
      - "The Network Wireless Transmitter can"
      - "transfer its items to the bound"
      - "Network Wireless Receiver (same world only)."
      - "Use the Network Wireless Configurator to bind."
      - "Each transfer consumes 500 J of network power."

  NTW_EXPANSION_ADVANCED_WIRELESS_TRANSMITTER:
    name: "Advanced Network Wireless Transmitter"
    lore:
      - "The Advanced Network Wireless Transmitter can"
      - "transfer its items to the bound"
      - "Network Wireless Receiver (same world only)."
      - "Use the Network Wireless Configurator to bind."

  NTW_NETWORK_WIRELESS_RECEIVER:
    name: "Network Wireless Receiver"
    lore:
      - "The Network Wireless Receiver can"
      - "receive items from the bound Network Wireless"
