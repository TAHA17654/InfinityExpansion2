      empty: "<warning>This cell is empty"
      converted: "<success>Converted the cell contents into a Quantum Storage of the matching tier"
      none-converted: "<warning>The cell has no convertible items"
    help:
      - "&6Networks Command Help:"
      - "&6/networks help - Show this help message."
      - "&6/networks celltoquantum - Convert the held storage cell's contents into a Quantum Storage of the matching tier."
      - "&6/networks fillquantum <amount> - Fill the held Quantum Storage with the given amount."
      - "&6/networks fixblueprint <keyInMeta> - Fix the held crafting blueprint."
      - "&6/networks addstorageitem <amount> - Add items to the Network Drawer you are looking at."
      - "&6/networks reducestorageitem <amount> - Remove items from the Network Drawer you are looking at."
      - "&6/networks setquantum <amount> - Set the stored amount of the Quantum Storage you are looking at."
      - "&6/networks setcontainerid <containerId> - Set the container ID of a Network Drawer."
      - "&6/networks updateitem - Update the held item."
      - "&6/networks getstorageitem <slot> - Get the item in the given slot of the Network Drawer you are looking at."
      - "&6/networks viewlog - Output the log of the AdminDebuggable you are looking at."
    example:
      help:
        - "&6/networks help - Show this help message."
        - "&6ex: /networks help"
      celltoquantum:
        - "&6/networks celltoquantum - Convert the held storage cell's contents into a Quantum Storage of the matching tier."
        - "&6ex: /networks celltoquantum"
      fillquantum:
        - "&6/networks fillQuantum <amount> - Set the stored amount of the held Quantum Storage."
        - "&6ex: /networks fillQuantum 1000"
      fixblueprint:
        - "&6/networks fixBlueprint <keyInMeta> - Fix the held crafting blueprint."
        - "&6ex: /networks fixBlueprint networks-changed"
      addstorageitem:
        - "&6/networks addStorageItem <amount> - Add the specified amount of the held item to the Cargo Storage you are looking at."
        - "&6ex: /networks addstorageItem 1000"
      reducestorageitem:
        - "&6/networks reduceStorageItem <amount> - Remove the specified amount of the held item from the Cargo Storage you are looking at."
        - "&6ex: /networks reduceStorageItem 1000"
      setquantum:
        - "&6/networks setQuantum <amount> - Set the item of the Quantum Storage you are looking at to the held item, and set its stored amount."
        - "&6ex: /networks setQuantum 1000"
      setcontainerid:
        - "&6/networks setContainerId <containerId> - Set the container ID of the Cargo Storage you are looking at."
        - "&6ex: /networks setContainerId 6"
      getstorageitem:
        - "&6/networks getStorageItem <slot> - Get the item in the given slot of the Cargo Storage you are looking at."
        - "&6ex: /networks getStorageItem 0"
      updateitem:
        - "&6/networks updateItem - Update the held item."
        - "&6ex: /networks updateItem"
      viewlog:
        - "&6/networks viewLog - Output the log of the AdminDebuggable you are looking at."
        - "&6ex: /networks viewLog"
      unknown-command:
        - "<error>Unknown command! Use /networks help for help."
