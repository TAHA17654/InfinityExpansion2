  NTW_EXPANSION_CHAIN_GRABBER:
    name: "Chain Grabber"
    lore:
      - "<passive>Grabs container items into the network along the set direction"
      - ""
      - "<click_info>Click the range slot with an item<passive> amount equals range"
      - "<passive>Insert <gold>Chain Modules<passive> to expand abilities"

  NTW_EXPANSION_CHAIN_PUSHER:
    name: "Chain Pusher"
    lore:
      - "<passive>Pushes template items along the set direction into line containers"
      - ""
      - "<click_info>Template slot<passive> Place the item to push"
      - "<passive>Insert <gold>Chain Modules<passive> to expand abilities"

  NTW_EXPANSION_CHAIN_TRANSCEIVER:
    name: "Chain Transceiver"
    lore:
      - "<passive>On the same line, pushes template items then grabs target items back"
      - ""
      - "<click_info>Template slot<passive> Place the item to push"
      - "<passive>Insert <gold>Chain Modules<passive> to expand abilities"

  NTW_EXPANSION_CHAIN_MODULE_RANGE:
    name: "Chain Range Module"
    lore:
      - "<passive>Increases the transfer range of chain machines"
      - ""
      - "<passive>Each module gives <aqua>+16 blocks<passive>, up to 3 modules"
      - "<click_info>Place in a module slot<passive> to take effect"

  NTW_EXPANSION_CHAIN_MODULE_CAPACITY:
    name: "Chain Capacity Module"
    lore:
      - "<passive>Adds template slots to Pushers / Transceivers"
      - ""
      - "<passive>Each module gives <aqua>+3 slots<passive>, up to 2 modules"
      - "<error>Grabbers have no template slots, so it has no effect"

  NTW_EXPANSION_CHAIN_MODULE_MODE:
    name: "Chain Mode Module"
    lore:
      - "<passive>Unlocks transfer mode switching"
      - ""
      - "<click_info>Place in a module slot<passive> to take effect"
      - "<click_info>Click the mode slot<passive> Left/right click to switch"

  NTW_EXPANSION_CHAIN_MODULE_VANILLA:
    name: "Chain Vanilla Container Module"
    lore:
      - "<passive>Lets chain machines recognize vanilla containers"
      - ""
      - "<click_info>Place in a module slot<passive> to take effect"

  NTW_EXPANSION_CHAIN_MODULE_MULTI_DIRECTION:
    name: "Chain Multi-Direction Module"
    lore:
      - "<passive>Lets chain machines transfer in multiple directions at once"
      - ""
      - "<click_info>Click the direction slot<passive> to add or remove directions"

  NTW_EXPANSION_CHAIN_MODULE_BINDING:
    name: "Chain Binding Module"
    lore:
      - "<passive>Install in a Pusher / Transceiver to unlock <gold>Split Supply<passive>"
      - "<passive>Assign a specific supply item to each container on the line"
      - ""
      - "<click_info>Place in a module slot<passive> to take effect · Data is kept after removal"
  NTW_EXPANSION_CHAIN_CONFIGURATOR:
    name: "Chain Configurator"
    lore:
      - "<passive>Copy a whole line · One-click migration"
      - ""
      - "<gold>[Left Click]<aqua> Source machine · Copy direction config"
      - "<gold>[Right Click]<aqua> Target machine · Write per distance"
      - "<gold>[Shift+Air Swing]<aqua> Clear saved config"
      - "<passive>Sneak when applying · Writes lists only, not modes"

  NTW_EXPANSION_CHAIN_BRUSH:
    name: "Chain List Brush"
    lore:
      - "<passive>Click to edit · Remote feeding setup"
      - ""
      - "<gold>[Right Click]<aqua> Machine on line · Jump to list editing"
      - "<gold>[Shift+Right Click]<aqua> Machine on line · Clear that position's list"
      - "<gold>[Right Click]<aqua> Pusher · Open direction page"
      - "<passive>Right-click a direction in the direction page · Bulk write the whole direction"

