items:
  # DO NOT CHANGE OR DELETE THESE ANNOUNCEMENTS
  NTW_EXPANSION_ANNOUNCEMENT_01:
    name: "<color_random_string>Definitions"
    lore:
      - "<warning> 1) Statement refers to all statements here."
      - "<warning> 2) Networks refers to a Slimefun addon, not a network in the sense of the Internet, the Internet of Things, or any other traditional meaning."
      - "<warning> 3) NetworksExpansion (hereinafter \"Networks Expansion\", \"this addon\" or \"this project\") refers to a Slimefun addon developed by the Networks Expansion development team on the basis of Networks, in full compliance with the GPLv3 license, with appropriate additions, deletions and modifications, based on Paper 1.20.1 and the Chinese-localized Slimefun, and not fully compatible with Paper 1.20.5 and above."
      - "<warning> 4) The Networks Expansion developers (hereinafter \"the Networks Expansion development team\", \"the Networks Expansion creators\") are the group that develops Networks Expansion, and are not owned by any company or organization."
  NTW_EXPANSION_ANNOUNCEMENT_02:
    name: "<color_random_string>Networks Expansion Work Statement"
    lore:
      - "<warning> Before reading this statement, be sure to read the Definitions first."
      - "<warning> 1) Networks Expansion is completely free, shared, and open-source on GitHub, for supporters, maintainers and creators to learn from and use."
      - "<warning> 2) The GPLv3 license is the open-source license of Networks Expansion. Anyone may freely use, modify and distribute it, but any modification or distribution must comply with the GPLv3 license."
      - "<warning> 3) \"Networks Expansion\" here is merely the title of this file, and carries no ambiguity or profit-related implication."
      - "<warning> 4) The Networks Expansion developers act only as the creators of this addon, do not provide any commercial support for it, and no longer actively maintain it. In addition, the Networks Expansion developers never take part in any direct or indirect operation of any server."
      - "<warning> 5) It is strictly forbidden to use the above plugins and this addon to promote any form of negative or violent content; it is strictly forbidden to use the above files for illegal or infringing activities; it is strictly forbidden to involve any politics or vulgar content."
      - "<warning> 6) Reselling is strictly forbidden, including but not limited to disguised trading, and tampering with the above files without permission to make any profit."
      - "<warning> 7) We strongly condemn the above prohibited acts, and encourage everyone to supervise one another and actively report violations and illegal acts."
      - "<warning> 8) All consequences caused by improper use by you or your group must be borne by yourself; it is strictly forbidden to shift responsibility in any form onto the maintainers and creators of the above plugins and configuration files."
      - "<warning> 9) Infringers shall, depending on the circumstances, bear civil liability such as ceasing the infringement, eliminating the impact, making an apology, and compensating for losses; where public interest is harmed, the copyright administrative authority may also order the infringement to stop, confiscate illegal gains, confiscate and destroy infringing copies, and impose fines; where the circumstances are serious enough to constitute a crime, criminal liability will be pursued in accordance with the law."
      - "<warning> 10) When the Networks Expansion developers do not pursue an infringer's infringement, it does not mean the developers approve of the infringement, nor that the infringer bears no responsibility."
      - "<warning> Please be sure to abide by the above statement."
  NTW_EXPANSION_ANNOUNCEMENT_03:
    name: "<color_random_string>Networks Expansion Author Statement"
    lore:
      - "<warning> Before reading this statement, be sure to read the Networks Expansion Usage Statement first."
      - "<warning> 1) All members of the Networks Expansion development team are citizens of the People's Republic of China, sincerely endorse the theory of socialism with Chinese characteristics, and uphold the leadership of the Communist Party of China."
      - "<warning> 2) Members of the Networks Expansion development team oppose decadent and backward ideologies such as capitalism, imperialism, hegemonism and feudalism."
      - "<warning> 3) Members of the Networks Expansion development team consciously abide by the constitution and laws, and oppose cyberbullying."
      - "<warning> 4) Members of the Networks Expansion development team consciously abide by community rules, avoiding abusive language and communicating civilly."
      - "<warning> 5) Insulting or attacking the Networks Expansion development team or its members will be dealt with according to law, and cyberbullying such as \"doxxing\" will be reported to the police."
      - "<warning> 6) This statement represents only the position of the Networks Expansion development team, and does not represent anyone else, any game, organization, company, country, or social group, nor the player community of any game."
      - "<warning> 7) This statement is not intended to favor any party; it addresses only the matter itself, not the people involved."
      - "<passive> This addon was written by Sefiraat, localized into Chinese by ybw0014, and further modified and maintained by yitoudaidai and tinalness."
      - "<passive> Thanks to the machines of LogiTech for providing the author head hash."
      - "<passive> Thanks to all server owners who trusted us and installed Networks Expansion."
      - "<passive> This addon was inspired by the wider player community."
      - "<passive> Special thanks to players such as Utoboy, TouRuya, haiman233 and matl114 for their feedback."
      - "<passive> Thanks to testers such as Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114 and lengshang for testing."
  NTW_EXPANSION_ANNOUNCEMENT_04:
    name: "<color_random_string>Networks Expansion Links"
    lore:
      - "<warning> Before reading this statement, be sure to read the Networks Expansion Author Statement first."
      - "<passive> Below are the links related to Networks Expansion: (please only trust these links)"
      - "<passive> Networks Expansion build site: <click_info>https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> Networks Expansion stable GitHub repository: <click_info>https://github.com/ytdd9527/NetworksExpansion"
      - "<passive> Networks Expansion stable GitHub Issues: <click_info>https://github.com/ytdd9527/NetworksExpansion/issues"
      - "<passive> Networks Expansion stable GitHub PRs: <click_info>https://github.com/ytdd9527/NetworksExpansion/pulls"
      - "<passive> Networks Expansion development GitHub repository: <click_info>https://github.com/balugaq/NetworksExpansion"
      - "<warning> The Networks Expansion development version does not accept GitHub Issues"
      - "<warning> The Networks Expansion development version does not accept GitHub PRs"
      - "<passive> Networks Expansion author GitHub page: <click_info>https://github.com/ytdd9527"
      - "<passive> Networks Expansion author GitHub page: <click_info>https://github.com/balugaq"
  NTW_EXPANSION_ANNOUNCEMENT_05:
    name: "<color_random_string>Networks Expansion Links"
    lore:
      - "<warning> Before reading this statement, be sure to read the Networks Expansion FAQ first."
      - "<warning> 1) The Networks Expansion developers have no obligation to maintain this addon. For any errors, vulnerabilities or problems that suddenly appear in the stable version of Networks Expansion, please promptly submit an Issue to this addon's stable GitHub repository."
      - "<passive> 2) We cannot guarantee that all problems will be fixed promptly, but we will do our best to fix them."
      - "<passive> 3) When communicating with the developers, please remain polite and do not attack or insult them maliciously. This is the effective way to communicate to get your problem solved."
      - "<warning> 4) By using, playing or modifying Networks Expansion, you are deemed to agree to abide by these statements."
      - "<passive> 5) The Networks Expansion developers reserve the right to modify or terminate this statement at any time."
      - "<warning> 6) When this statement is updated, you should check for yourself whether you have any objections. Generally, after a version update, the Networks Expansion development team assumes you agree to abide by these statements."
      - "<passive> 7) You should avoid involving \"Networks Expansion\", \"the Networks Expansion development team\" or \"members of the Networks Expansion development team\" in political or public incidents through your use of Networks Expansion. <warning>Otherwise the Networks Expansion development team has the right to suspend or terminate maintenance of Networks Expansion."
      - "<passive> 8) If versions of this statement in other languages are published by the Networks Expansion developers, the Chinese version shall prevail."
      - "<passive> 9) The validity, performance, interpretation and dispute resolution of this statement are governed by the laws of mainland China (excluding conflict-of-laws rules)."
      - "<passive> 10) All headings in this statement are for reading convenience only, have no actual meaning in themselves, and cannot be used as a basis for interpreting this statement."
      - "<warning> 11) If any part of this statement is invalid for any reason, the remaining terms remain valid and binding on all parties."
      - "<warning> 12) If you cannot see the full statement because your screen is too small or for similar reasons, please adjust it yourself; the Networks Expansion development team bears no responsibility for this."
      - "<warning> 13) If you cannot see the full item name or item description because your screen is too small or for similar reasons, the server owner or player should resolve it; the Networks Expansion development team bears no responsibility for this."
      - "<warning> 14) Networks Expansion allows anyone to use, copy, modify, merge, publish, distribute, exhibit and share this statement for non-profit purposes, but no one may use this statement for commercial purposes. Any promotion in the name of Networks Expansion or the Networks Expansion development team is also prohibited."
      - "<warning> 15) The right to interpret all statements of this addon belongs to the Networks Expansion developers."
  NTW_EXPANSION_ANNOUNCE_9:
    name: "<color_random_string>Networks Expansion Version Info"
    lore:
      - "<warning> Before reading this statement, be sure to read the Networks Expansion Supplementary Notes first."
      - "<passive> Developer(s): ytdd9527, balugaq"
      - "<passive> Developer GitHub page: <click_info>https://github.com/ytdd9527"
      - "<passive> Developer GitHub page: <click_info>https://github.com/balugaq"
      - "<passive> Networks Expansion stable download: https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> Networks Expansion development download: https://github.com/balugaq/NetworksExpansion"
      - "<passive> Thanks to everyone who contributed Issues, PRs and commits to Networks Expansion development!"
      - "<passive> Thanks to everyone who offered suggestions for Networks Expansion development!"
      - "<passive> Thanks to players such as Utoboy, TouRuya, haiman233, yitoudaidai, tinalness and matl114 for their suggestions for Networks Expansion development!"
  NTW_EXPANSION_ANNOUNCE_10:
    name: "<color_random_string>Networks Expansion Gameplay Experience Statement"
    lore:
      - "<warning> Before reading this statement, be sure to read the Networks Expansion Version Info first."
      - "<passive> Regarding the Network Auto-Crafter losing blueprints, according to an announcement by the Slimefun developers:"
      - "<passive> -- When an item's PDC data is too large, the item cannot be saved to the Slimefun database. The server owner must adjust the database column data types themselves"
      - "<passive> -- and enable the `bypass-item-length-check` option in the settings to skip the item size check."
      - "<passive> The PDC of Network Auto-Crafter blueprints is usually very large, in order to stay compatible with blueprints from several years ago and ensure the player experience."
      - "<passive> In addition, according to matl114's testing, upgrading a machine in place may also cause items to be lost:"
      - "<passive> Here is an example that <warning>may<passive> be reproducible: place machine A, put C of item D in slot B, break it and replace it with machine E, put C of item D in slot B,"
      - "<passive> after a server restart, the item D in machine E disappears."
      - "<passive> The causes above have little to do with Networks Expansion; please stay rational while playing and do not blindly attack Networks Expansion verbally."
      - "<passive> End of statement."

  NTW_EXPANSION_WORKBENCH:
    name: "Networks Expansion Workbench"
    lore:
      - "Can craft various materials and machines of Networks Expansion"

  NTW_EXPANSION_INFO_TOOL:
    name: "Network Info Tool"
    lore:
      - "Administrators only"
      - "Right Click to view detailed info on items in the network"

  NTW_EXPANSION_ADVANCED_IMPORT:
    name: "Advanced Network Importer"
    lore:
      - "The Advanced Network Importer sends the items inside it into the network"
      - "Can transfer up to 54 stacks of items per SF tick"
      - "Can receive items from Cargo networks"

  NTW_EXPANSION_ADVANCED_EXPORT:
    name: "Advanced Network Exporter"
    lore:
      - "The Advanced Network Exporter can be set to"
      - "continuously send a specified quantity of items out of the network"
      - "Items can be extracted from it using Cargo networks"

  NTW_EXPANSION_ADVANCED_PURGER:
    name: "Advanced Network Purger"
    lore:
      - "The Advanced Network Purger will, from the network,"
      - "Continuously removes the specified item"
      - "Removed items vanish immediately. Use with caution!"

  NTW_EXPANSION_ADVANCED_GREEDY_BLOCK:
    name: "Advanced Network Blocker"
    lore:
      - "The Advanced Network Blocker can be set to an item,"
      - "then collects that item from inputs"
      - "across the network, up to 9 stacks."
      - "Once full, it blocks that item from moving through the network,"
      - "and no other network block will receive it."

  NTW_EXPANSION_CAPACITOR_5:
    name: "Network Capacitor (5)"
    lore:
      - "The Network Capacitor receives power from"
      - "the energy network and stores it"
      - "for use by other network devices"
      - ""
      - "<click_info>Capacity: &7100,000,000"

  NTW_EXPANSION_CAPACITOR_6:
    name: "Network Capacitor (6)"
    lore:
      - "The Network Capacitor receives power from"
