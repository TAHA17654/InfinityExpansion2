name: MachineStacker
version: 1.0.0
main: com.example.machinestacker.MachineStacker
api-version: '1.20'
depend: [Slimefun]
description: Stack up to 64 Slimefun machines into one block with the same total output.
commands:
  machinestacker:
    description: Show info about the stacked machine you are looking at
    aliases: [mstack]
permissions:
  machinestacker.use:
    default: true
  machinestacker.reload:
    default: op
